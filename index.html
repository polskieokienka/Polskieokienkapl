<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Ogólnopolska Platforma Reklamowo-Turystyczna</title>
    <style>
        /* PODSTAWOWE CONFIGI I MOTYW ULTRA PREMIUM */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-darker: #050608;
            --bg-panel: rgba(15, 17, 24, 0.95);
            --border-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f3f4f6;
        }

        body {
            background: radial-gradient(circle at top, #161925 0%, #08090d 60%, #020203 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        /* NAGŁÓWEK GŁÓWNY (GLASSMORPHISM + ZŁOTE AKCENTY) */
        .header-panel {
            background: linear-gradient(135deg, #12151f 0%, #07080c 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12), inset 0 1px 1px rgba(255,255,255,0.05);
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h2 { 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 24px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.7);
        }
        
        .stats-container { display: flex; gap: 25px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
        .stat-item { color: #9ca3af; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
        .stat-item span { color: var(--gold-primary); font-size: 15px; font-weight: 800; text-shadow: 0 0 8px rgba(212,175,55,0.3); }

        /* JĘZYKI */
        .lang-selector { 
            display: flex; 
            gap: 12px; 
            background: rgba(0,0,0,0.5); 
            padding: 8px 16px; 
            border-radius: 30px; 
            border: 1px solid rgba(212,175,55,0.3); 
        }
        .lang-flag { font-size: 22px; cursor: pointer; transition: transform 0.2s, filter 0.2s; filter: grayscale(40%); }
        .lang-flag:hover { transform: scale(1.25); filter: grayscale(0%); }
        .lang-flag.active { filter: grayscale(0%); transform: scale(1.15); border-bottom: 2px solid var(--gold-primary); }

        /* GŁÓWNY WIDOK: MAPA */
        #map-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 60px rgba(0,0,0,0.85);
            box-sizing: border-box;
            animation: fadeIn 0.5s ease;
        }

        #map-view h1 { 
            color: var(--gold-primary); 
            font-size: 16px; 
            margin: 0 0 25px 0; 
            text-transform: uppercase; 
            text-align: center; 
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1.1 / 1;
            background: #040507;
            border: 2px solid #171a22;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.95);
        }

        .poland-svg-bg {
            position: absolute;
            top: 2%; left: 2%; width: 96%; height: 96%;
            z-index: 1; pointer-events: none;
        }

        /* NAWIGACJA PINEZEK NA MAPIE */
        .city-pin {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            background: none; border: none; padding: 0; margin: 0;
            cursor: pointer; outline: none;
        }
        
        .pin-dot {
            width: 14px; height: 14px;
            background-color: var(--gold-primary); border: 2px solid #050608; border-radius: 50%;
            box-shadow: 0 0 15px var(--gold-primary), 0 0 5px var(--gold-dark);
            transition: all 0.2s ease; z-index: 2;
        }
        
        .city-label {
            color: #ffffff; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap;
            background: rgba(4, 5, 7, 0.95); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--gold-primary);
            box-shadow: 0 6px 15px rgba(0,0,0,0.8); transition: all 0.2s ease; position: absolute;
            letter-spacing: 0.5px;
        }

        /* Pozycjonowanie etykiet miast */
        .lbl-top { bottom: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-bottom { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-left { right: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-right { left: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-szklarska { bottom: 22px; right: -25px; transform: translateX(0); }
        .lbl-karpacz { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-swieradow { bottom: 22px; left: -35px; transform: translateX(0); }

        .city-pin:hover .pin-dot { transform: scale(1.6); background-color: #ffffff; box-shadow: 0 0 25px #ffffff; }
        .city-pin:hover .city-label { background: var(--gold-primary); color: #000000; font-weight: 900; box-shadow: 0 0 20px rgba(212,175,55,0.6); z-index: 50; }

        /* Współrzędne miast na mapie */
        #pin-swinoujscie { top: 18%; left: 8%; }
        #pin-kolobrzeg   { top: 12%; left: 23%; }
        #pin-sopot        { top: 10%; left: 50%; }
        #pin-swieradow    { top: 73%; left: 10%; }
        #pin-szklarska    { top: 76%; left: 15%; }
        #pin-karpacz      { top: 79%; left: 21%; }
        #pin-wisla        { top: 86%; left: 51%; }
        #pin-zakopane     { top: 92%; left: 64%; }
        #pin-szccawnica   { top: 89%; left: 72%; }
        #pin-krynica      { top: 86%; left: 81%; }

        /* INTEGRACJA TURYSTYCZNA (POGODA / AUTOBUSY / TRASY) */
        .tourist-zone {
            width: 100%; max-width: 1400px; margin: 30px 0;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; box-sizing: border-box;
        }

        .tourist-panel {
            background: linear-gradient(135deg, #12141c, #07080c); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px; padding: 22px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .tourist-panel:hover { border-color: var(--gold-primary); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.05); }

        .tourist-panel h3 {
            margin: 0 0 16px 0; color: var(--gold-primary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed rgba(212,175,55,0.2); padding-bottom: 10px;
        }

        .weather-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .weather-temp { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
        
        .trail-status { background: rgba(212, 175, 55, 0.08); color: var(--gold-primary); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; text-align: center; border: 1px solid rgba(212, 175, 55, 0.3); }

        .bus-list { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
        .bus-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.01); padding: 10px; border-radius: 8px; border-left: 3px solid var(--gold-primary); border-top: 1px solid rgba(255,255,255,0.02); }
        .bus-time { color: var(--gold-primary); font-weight: bold; }

        .trail-select { width: 100%; padding: 12px; background: #040507; border: 1px solid #1a1d26; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 15px; outline: none; color: var(--gold-primary); font-weight: bold; }
        .trail-select:focus { border-color: var(--gold-primary); }
        .trail-result { font-size: 12px; color: #9ca3af; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; min-height: 45px; border: 1px solid #161821; line-height: 1.5; }

        /* DRUGI WIDOK: RADAR RETINA BILLBOARD */
        #dashboard-view { display: none; width: 100%; max-width: 1450px; animation: fadeIn 0.4s ease; }
        
        .back-btn {
            background: #07080c; color: var(--gold-primary); border: 1px solid var(--gold-primary);
            padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold;
            margin-bottom: 20px; transition: all 0.2s ease; text-transform: uppercase; font-size: 12px;
            letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .back-btn:hover { background: var(--gold-primary); color: #000000; box-shadow: 0 0 20px rgba(212,175,55,0.4); }

        /* PRAWDZIWA ZŁOTA RAMA (EFEKT CHROMU METALEGO) */
        .billboard-frame {
            background: linear-gradient(135deg, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #aa7c11 100%);
            padding: 14px; border-radius: 18px; box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 0 15px rgba(255,255,255,0.3);
            border: 2px solid #73540b; box-sizing: border-box; width: 100%;
        }

        .billboard-inner { background-color: #07080c; border: 2px solid #161822; padding: 20px; border-radius: 10px; }
        .layout-grid { display: flex; flex-direction: column; gap: 25px; }
        .grid-wrapper { flex: 1.5; width: 100%; overflow-x: auto; padding-bottom: 5px; }

        /* POTĘŻNA SIATKA MATRYCY 10x10 */
        .grid-board {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            gap: 6px; background-color: #030405; padding: 12px; border-radius: 10px;
            border: 2px solid #14161f; box-sizing: border-box; aspect-ratio: 1; min-width: 520px;
        }

        .cell-link { text-decoration: none; display: block; width: 100%; height: 100%; }

        .grid-item {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #131620 0%, #07080b 100%);
            border: 1px solid #1f2433; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; color: #6b7280; text-align: center;
            cursor: pointer; transition: all 0.15s ease; box-sizing: border-box; position: relative;
        }
        .cell-link:hover .grid-item { transform: scale(1.1); z-index: 5; border-color: var(--gold-primary); box-shadow: 0 0 15px rgba(212,175,55,0.4); color: #ffffff; }
        
        .grid-item.premium { border: 1px solid var(--gold-primary); color: var(--gold-primary); background: linear-gradient(135deg, #1f1805 0%, #07080c 100%); }
        .grid-item.occupied { border-color: #3b82f6; color: #93c5fd; }

        /* TELEBIM REKLAMOWY CENTRALNY (4x4 PANEL OPERACYJNY) */
        .grid-center {
            grid-column: 4 / span 4; grid-row: 4 / span 4;
            background: linear-gradient(135deg, #030406 0%, #0e1118 100%);
            border: 2px solid var(--gold-primary); border-radius: 10px; padding: 12px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 20px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; text-align: center; box-sizing: border-box; position: relative; z-index: 2;
        }
        .banner-crown { color: var(--gold-primary); font-size: 9px; font-weight: 900; text-transform: uppercase; width: 100%; border-bottom: 1px dashed var(--gold-primary); padding-bottom: 5px; letter-spacing: 1px;}
        .banner-main-title { font-size: 13px; font-weight: 900; color: var(--gold-primary); text-shadow: 0 0 10px rgba(212,175,55,0.4); letter-spacing: 0.5px; margin: 2px 0; }
        #winnerName { font-size: 10px; color: #ffffff; font-weight: bold; background: rgba(255,255,255,0.02); border: 1px solid rgba(212,175,55,0.15); padding: 5px; border-radius: 4px; width: 95%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .live-countdown { background: #dc2626; color: #ffffff; font-family: monospace; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 2px 8px rgba(220,38,38,0.4); }

        .center-wheel-box { position: relative; width: 80px; height: 80px; margin: 2px 0; }
        #centerWheel { width: 100%; height: 100%; border-radius: 50%; border: 1px solid var(--gold-primary); transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1); }
        
        .btn-center-spin {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%); color: #000000; font-size: 9px; font-weight: 900; border: none;
            padding: 4px 10px; border-radius: 12px; cursor: pointer; text-transform: uppercase; box-shadow: 0 3px 8px rgba(0,0,0,0.6); transition: all 0.1s;
        }
        .btn-center-spin:hover { transform: scale(1.05); }

        /* SKALOWALNE PANELU KÓŁ FORTUNY (SIDEBAR) */
        .wheels-sidebar { display: flex; flex-direction: column; gap: 25px; flex: 0.8; width: 100%; box-sizing: border-box; }

        .wheel-card {
            background: rgba(7,8,12,0.95); padding: 20px; border-radius: 16px; border: 2px solid #161922;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); flex: 1; box-sizing: border-box;
            transition: all 0.3s ease; width: 100%;
        }
        .wheel-card:hover { border-color: var(--gold-primary); box-shadow: 0 15px 40px rgba(212,175,55,0.03); }
        .wheel-card h3 { font-size: 13px; color: var(--gold-primary); margin: 0 0 16px 0; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; }

        .wheel-box { position: relative; width: 180px; height: 180px; margin-bottom: 15px; }
        .wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--gold-primary); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        .wheel-pointer {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 18px solid var(--gold-primary); z-index: 20; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%); color: #000000;
            border: none; padding: 12px 20px; font-size: 11px; font-weight: 900;
            border-radius: 25px; cursor: pointer; width: 100%; text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(212,175,55,0.2); transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212,175,55,0.4); }
        .btn:disabled, .btn-center-spin:disabled { background: #161822 !important; color: #4b5563 !important; cursor: not-allowed; box-shadow: none !important; transform: none !important; border: 1px solid #232736 !important; }

        .result-display {
            display: none; width: 100%; background: rgba(255,255,255,0.02);
            border: 1px solid var(--gold-primary); border-radius: 8px; padding: 10px; margin-top: 12px;
            box-sizing: border-box; text-align: center; font-size: 11px; animation: fadeIn 0.3s ease; line-height: 1.4;
        }
        .result-display a { color: var(--gold-primary); font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 4px; }

        /* DOLNY PASEK REKLAMOWY (TICKER) */
        .ticker-wrap {
            position: fixed; bottom: 0; left: 0; width: 100%; background: linear-gradient(90deg, #030405, #0d0f17);
            border-top: 2px solid var(--gold-primary); padding: 14px 0; overflow: hidden; z-index: 999;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.6);
        }
        .ticker-title {
            position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold-primary); color: #000000;
            font-weight: 900; font-size: 11px; display: flex; align-items: center; padding: 0 24px; z-index: 10; text-transform: uppercase; letter-spacing: 1px;
        }
        .ticker { display: flex; white-space: nowrap; padding-left: 150px; animation: ticker 28s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 30px; color: #ffffff; font-size: 13px; font-weight: bold; border-right: 1px dashed rgba(212,175,55,0.3); }
        .ticker-item a { color: var(--gold-primary); text-decoration: none; margin-left: 6px; border-bottom: 1px solid transparent; }
        .ticker-item a:hover { border-color: var(--gold-primary); }

        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

        /* CZAT ASYSTENT AI SYSTEMOWY */
        .chat-widget {
            position: fixed; bottom: 75px; right: 25px; width: 330px; background: rgba(8, 9, 14, 0.98);
            border: 2px solid var(--gold-primary); border-radius: 16px; box-shadow: 0 15px 50px rgba(0,0,0,0.85);
            display: flex; flex-direction: column; z-index: 1000; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-widget.collapsed { width: 55px; height: 55px; border-radius: 50%; bottom: 75px; }
        .chat-header {
            background: linear-gradient(135deg, #0f111a, #030406); padding: 14px; color: var(--gold-primary);
            font-weight: 900; font-size: 12px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #161822;
        }
        .chat-header span.status-dot { width: 8px; height: 8px; background: var(--gold-primary); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px var(--gold-primary); }
        .chat-body { padding: 14px; height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 12px; background: #030406; }
        .chat-widget.collapsed .chat-body, .chat-widget.collapsed .chat-input-area { display: none; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.4; word-wrap: break-word; font-weight: 500; }
        .msg.bot { background: #0e1118; color: #ffffff; align-self: flex-start; border-left: 3px solid var(--gold-primary); border-top: 1px solid rgba(255,255,255,0.02); }
        .msg.user { background: rgba(212,175,55,0.12); color: var(--gold-primary); align-self: flex-end; border: 1px solid rgba(212,175,55,0.25); }
        
        .chat-input-area { display: flex; border-top: 1px solid #161822; background: #0e1118; }
        .chat-input { flex: 1; padding: 14px; background: none; border: none; color: #fff; font-size: 12px; outline: none; }
        .chat-input::placeholder { color: #4b5563; }
        .chat-btn { background: var(--gold-primary); border: none; color: #000000; font-weight: 900; padding: 0 18px; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: background 0.2s; }
        .chat-btn:hover { background
