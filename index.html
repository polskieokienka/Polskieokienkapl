<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polskie Okienka Live - Regionalny Portal Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark-core: #0b0f19;
            --panel-bg: #131a26;
            --gold-primary: #fbbf24;
            --emerald-light: #34d399;
            --diamond-blue: #22d3ee;
            --purple-premium: #a855f7;
            --danger-color: #ef4444;
            --blue-tourist: #3b82f6;
        }

        body {
            background-color: var(--bg-dark-core);
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
        }

        .app-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border-bottom: 2px solid var(--gold-primary);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-logo-zone h1 {
            margin: 0;
            font-size: 20px;
            color: #fff;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            font-size: 12px;
        }

        .stat-item span {
            color: var(--gold-primary);
            font-weight: bold;
        }

        .navigation-row {
            background: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #1e293b;
            color: #9ca3af;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #334155;
            color: #fff;
        }

        .nav-btn.active {
            background: var(--gold-primary);
            color: #000;
            border-color: var(--gold-primary);
        }

        .nav-btn-biz.active {
            background: var(--purple-premium) !important;
            color: #fff !important;
            border-color: var(--purple-premium) !important;
        }

        .nav-btn-admin.active {
            background: var(--danger-color) !important;
            color: #fff !important;
            border-color: var(--danger-color) !important;
        }

        .city-filter-container {
            padding: 15px 20px;
            background: #111827;
        }

        .city-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .city-pin {
            background: #1f293d;
            border: 1px solid #2d3748;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            color: #cbd5e1;
            transition: background 0.2s;
        }

        .city-pin:hover {
            background: #374151;
        }

        .city-pin.active-city {
            background: var(--diamond-blue);
            color: #000;
            font-weight: bold;
            border-color: var(--diamond-blue);
        }

        .app-view {
            display: none;
            padding: 20px;
        }

        .app-view.active-view {
            display: block;
        }

        .main-board-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        .grid-matrix-container {
            background: #090d16;
            border: 2px solid #1f293d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.8);
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        .grid-item {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .grid-item:hover {
            transform: scale(1.04);
            z-index: 10;
            box-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .gold-vacant { background: rgba(251,191,36,0.03); border: 1px dashed rgba(251,191,36,0.4); color: var(--gold-primary); }
        .gold-active { background: linear-gradient(135deg, #2e2300 0%, #1c1500 100%); border: 2px solid var(--gold-primary); color: #fff; }
        .standard-vacant { background: rgba(34,211,238,0.02); border: 1px dashed rgba(34,211,238,0.3); color: var(--diamond-blue); }
        .standard-active { background: linear-gradient(135deg, #082f49 0%, #0f172a 100%); border: 2px solid var(--diamond-blue); color: #fff; }

        .grid-item-logo-img {
            max-width: 90%;
            max-height: 60%;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .telebim-container {
            background: #000;
            border: 3px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 25px rgba(168,85,247,0.3);
            text-align: center;
            position: relative;
        }

        .telebim-screen {
            background: #050505;
            border: 1px solid #111;
            border-radius: 4px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .telebim-title {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tourist-panel {
            background: var(--panel-bg);
            border: 1px solid #1e293b;
            border-left: 4px solid var(--gold-primary);
            border-radius: 8px;
            padding: 15px;
        }

        .alert-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid var(--danger-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tourist-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        /* STRUKTURA KOŁA FORTUNY */

            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }

            height: 100%;
            border-radius: 50%;
            border: 6px solid #1e293b;
