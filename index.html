<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Ogólnopolska Platforma Reklamowo-Turystyczna</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* CONFIGI I MOTYW ULTRA PREMIUM */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-darker: #050608;
            --bg-panel: rgba(15, 17, 24, 0.95);
            --border-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f3f4f6;
            --green-live: #2ecc71;
            --blue-tourist: #1565c0;
        }

        body {
            background: radial-gradient(circle at top, #161925 0%, #08090d 60%, #020203 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        /* NAGŁÓWEK GŁÓWNY */
        .header-panel {
            background: linear-gradient(135deg, #12151f 0%, #07080c 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12), inset 0 1px 1px rgba(255,255,255,0.05);
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h2 { 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 24px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.7);
        }
        
        .stats-container { display: flex; gap: 25px; font-size: 13px; font-weight: 600; flex-wrap: wrap; align-items: center; }
        .stat-item { display: flex; align-items: center; gap: 8px; color: #9ca3af; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
        .stat-item span.stat-value { color: var(--gold-primary); font-size: 15px; font-weight: 800; text-shadow: 0 0 8px rgba(212,175,55,0.3); }
        .stat-item span.live-value { color: var(--green-live); font-size: 15px; font-weight: 800; text-shadow: 0 0 8px rgba(46,204,113,0.4); }

        /* MODUŁ LOGOWANIA W MENU */
        .auth-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #333;
        }
        .auth-btn-quick {
            background: var(--gold-dark);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .auth-btn-quick:hover { background: var(--gold-primary); }
        .user-status-text { font-size: 12px; font-weight: 600; color: #fff; }

        /* PULSUJĄCA DIODA LIVE */
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-live);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            animation: live-pulse-anim 1.6s infinite;
        }
        @keyframes live-pulse-anim {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* JĘZYKI */
        .lang-selector { 
            display: flex; 
            gap: 12px; 
            background: rgba(0,0,0,0.5); 
            padding: 8px 16px; 
            border-radius: 30px; 
            border: 1px solid rgba(212,175,55,0.3); 
        }
        .lang-flag { font-size: 22px; cursor: pointer; transition: transform 0.2s, filter 0.2s; filter: grayscale(40%); }
        .lang-flag:hover { transform: scale(1.25); filter: grayscale(0%); }
        .lang-flag.active { filter: grayscale(0%); transform: scale(1.15); border-bottom: 2px solid var(--gold-primary); }

        /* GŁÓWNY WIDOK: MAPA */
        #map-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 60px rgba(0,0,0,0.85);
            box-sizing: border-box;
            animation: fadeIn 0.5s ease;
            margin-bottom: 25px;
        }

        #map-view h1 { 
            color: var(--gold-primary); 
            font-size: 16px; 
            margin: 0 0 25px 0; 
            text-transform: uppercase; 
            text-align: center; 
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1.1 / 1;
            background: #040507;
            border: 2px solid #171a22;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.95);
        }

        .poland-svg-bg {
            position: absolute;
            top: 2%; left: 2%; width: 96%; height: 96%;
            z-index: 1; pointer-events: none;
        }

        /* PINEZKI NA MAPIE */
        .city-pin {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            background: none; border: none; padding: 0; margin: 0;
            cursor: pointer; outline: none;
        }
        
        .pin-dot {
            width: 14px; height: 14px;
            background-color: var(--gold-primary); border: 2px solid #050608; border-radius: 50%;
            box-shadow: 0 0 15px var(--gold-primary), 0 0 5px var(--gold-dark);
            transition: all 0.2s ease; z-index: 2;
        }
        
        .city-label {
            color: #ffffff; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap;
            background: rgba(4, 5, 7, 0.95); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--gold-primary);
            box-shadow: 0 6px 15px rgba(0,0,0,0.8); transition: all 0.2s ease; position: absolute;
            letter-spacing: 0.5px;
        }

        .lbl-top { bottom: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-bottom { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-left { right: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-right { left: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-szklarska { bottom: 22px; right: -25px; transform: translateX(0); }
        .lbl-karpacz { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-swieradow { bottom: 22px; left: -35px; transform: translateX(0); }

        .city-pin:hover .pin-dot { transform: scale(1.6); background-color: #ffffff; box-shadow: 0 0 25px #ffffff; }
        .city-pin:hover .city-label { background: var(--gold-primary); color: #000000; font-weight: 900; box-shadow: 0 0 20px rgba(212,175,55,0.6); z-index: 50; }

        #pin-swinoujscie { top: 18%; left: 8%; }
        #pin-kolobrzeg   { top: 12%; left: 23%; }
        #pin-sopot        { top: 10%; left: 50%; }
        #pin-swieradow    { top: 73%; left: 10%; }
        #pin-szklarska    { top: 76%; left: 15%; }
        #pin-karpacz      { top: 79%; left: 21%; }
        #pin-wisla        { top: 86%; left: 51%; }
        #pin-zakopane     { top: 92%; left: 64%; }
        #pin-szccawnica   { top: 89%; left: 72%; }
        #pin-krynica      { top: 86%; left: 81%; }

        /* INTEGRACJA TURYSTYCZNA */
        .tourist-zone {
            width: 100%; max-width: 1400px; margin: 20px 0 30px 0;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; box-sizing: border-box;
        }

        .tourist-panel {
            background: linear-gradient(135deg, #12141c, #07080c); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px; padding: 22px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .tourist-panel:hover { border-color: var(--gold-primary); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.05); }

        .tourist-panel h3 {
            margin: 0 0 14px 0; color: var(--gold-primary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed rgba(212,175,55,0.2); padding-bottom: 10px;
        }

        .weather-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .weather-temp { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
        
        .trail-status { background: rgba(212, 175, 55, 0.08); color: var(--gold-primary); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; text-align: center; border: 1px solid rgba(212, 175, 55, 0.3); margin-top: auto; }

        .bus-list { display: flex; flex-direction: column; gap: 10px; font-size: 12px; margin-bottom: 15px; }
        .bus-item-link {
            display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(135deg, #1f2436, #131722); color: #fff; text-decoration: none;
            padding: 12px; border-radius: 8px; border-left: 4px solid #3498db; font-weight: bold;
            transition: all 0.2s; border-top: 1px solid rgba(255,255,255,0.03);
        }
        .bus-item-link:hover { background: #2980b9; color: #fff; transform: translateX(3px); }

        .trail-select { width: 100%; padding: 12px; background: #040507; border: 1px solid #1a1d26; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 15px; outline: none; color: var(--gold-primary); font-weight: bold; }
        .trail-select:focus { border-color: var(--gold-primary); }
        .trail-result { font-size: 12px; color: #9ca3af; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; min-height: 45px; border: 1px solid #161821; line-height: 1.5; margin-bottom: 15px; }

        /* PRZYCISK MAPY MTB / SZLAKÓW */
        .bike-map-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
            color: #000000; text-decoration: none; font-weight: 900; font-size: 12px;
            padding: 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(212,175,55,0.2); transition: all 0.2s;
            text-align: center;
        }
        .bike-map-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(212,175,55,0.4); }

        /* LIVE RESORT MONITOR */
        .resort-list { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .resort-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.02); }
        .badge-open { background: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-closed { background: rgba(239, 68, 68, 0.15); color: #ef4444; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid rgba(239, 68, 68, 0.3); }
        .live-pulse { display: inline-block; width: 6px; height: 6px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; animation: pulse 1.5s infinite; margin-left: auto; }

        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }

        /* WIDOK PANELU MATRYCY */
        #dashboard-view { display: block; width: 100%; max-width: 1450px; animation: fadeIn 0.4s ease; }
        
        .back-btn {
            background: #07080c; color: var(--gold-primary); border: 1px solid var(--gold-primary);
            padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold;
            margin-bottom: 20px; transition: all 0.2s ease; text-transform: uppercase; font-size: 12px;
            letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: block;
        }
        .back-btn:hover { background: var(--gold-primary); color: #000000; box-shadow: 0 0 20px rgba(212,175,55,0.4); }

        .billboard-frame {
            background: linear-gradient(135deg, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #aa7c11 100%);
            padding: 14px; border-radius: 18px; box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 0 15px rgba(255,255,255,0.3);
            border: 2px solid #73540b; box-sizing: border-box; width: 100%;
        }

        .billboard-inner { background-color: #07080c; border: 2px solid #161822; padding: 20px; border-radius: 10px; }
        .layout-grid { display: flex; flex-direction: column; gap: 25px; }
        .grid-wrapper { flex: 1.5; width: 100%; overflow-x: auto; padding-bottom: 5px; }

        /* POTĘŻNA SIATKA MATRYCY 10x10 */
        .grid-board {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            gap: 6px; background-color: #030405; padding: 12px; border-radius: 10px;
            border: 2px solid #14161f; box-sizing: border-box; aspect-ratio: 1; min-width: 520px;
            position: relative;
        }

        .cell-link { text-decoration: none; display: block; width: 100%; height: 100%; }

        .grid-item {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #131620 0%, #07080b 100%);
            border: 1px solid #1f2433; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; color: #6b7280; text-align: center;
            cursor: pointer; transition: all 0.15s ease; box-sizing: border-box; position: relative;
            min-height: 45px;
        }
        .cell-link:hover .grid-item { transform: scale(1.1); z-index: 5; border-color: var(--gold-primary); box-shadow: 0 0 15px rgba(212,175,55,0.4); color: #ffffff; }
        
        .grid-item.premium { border: 2px solid var(--gold-primary); color: var(--gold-primary); background: linear-gradient(135deg, #1f1805 0%, #07080c 100%); }
        .grid-item.occupied { border-color: #3b82f6; color: #93c5fd
