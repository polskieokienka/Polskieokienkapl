<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Oficjalna Tablica Reklamowa</title>
    <style>
        body {
            background: #0f1115 url('https://images.unsplash.com/photo-1605886300408-f404e76a6cf3?w=1600&auto=format&fit=crop&q=80') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Przyciemnienie tła krajobrazu pod tablicę */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* POTĘŻNA METALOWA RAMA BILLBOARDU */
        .billboard-frame {
            background: linear-gradient(135deg, #bdc3c7 0%, #eaeded 25%, #95a5a6 50%, #eaeded 75%, #7f8c8d 100%);
            padding: 22px;
            border-radius: 4px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.6);
            border: 4px solid #7f8c8d;
            max-width: 100%;
            width: 1004px;
            box-sizing: border-box;
            position: relative;
        }

        /* Nity montażowe na metalowej ramie */
        .billboard-frame::after {
            content: '•   •   •   •   •   •   •   •   •   •   •   •';
            position: absolute;
            top: 4px; left: 0; width: 100%;
            text-align: center;
            color: #555;
            font-size: 10px;
            letter-spacing: 25px;
        }

        .billboard-inner {
            background-color: #1a1d24;
            border: 3px solid #2c3e50;
            padding: 12px;
            border-radius: 2px;
        }

        /* GÓRNY NEONOWY NAGŁÓWEK NA TABLICY */
        .billboard-top-bar {
            background: #2c3e50;
            border: 2px solid #7f8c8d;
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 2px;
            color: #eaeded;
            text-shadow: 1px 1px 2px #000;
        }

        /* WIDOK ARCHITEKTURY STRONY */
        #map-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            background: rgba(20,24,33,0.95);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #map-view h1 { color: #ffd700; font-size: 22px; margin: 0 0 15px 0; text-transform: uppercase; text-align: center; }

        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #11141a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .city-pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #ffd700;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 12px #ffd700;
        }
        .city-label {
            position: absolute;
            color: #fff; font-size: 10px; font-weight: bold; white-space: nowrap;
            background: #000; padding: 2px 6px; border-radius: 3px; transform: translate(-50%, -180%);
        }
        #pin-karpacz { top: 75%; left: 35%; }
        #pin-zakopane { top: 88%; left: 65%; }

        #dashboard-view { display: none; width: 100%; }

        .back-btn {
            background: #2c3e50; color: #ffd700; border: 1px solid #ffd700;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;
            margin-bottom: 12px; transition: 0.2s; text-transform: uppercase; font-size: 12px;
        }
        .back-btn:hover { background: #ffd700; color: #000; }

        /* GŁÓWNA STRUKTURA PODZIAŁU */
        .layout-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media(min-width: 950px) {
            .layout-grid { flex-direction: row; align-items: flex-start; }
        }

        /* SIATKA OKIENEK REKLAMOWYCH */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            background: #11141b;
            padding: 10px;
            border-radius: 4px;
            border: 2px solid #2c3e50;
            flex: 1;
        }

        .cell-link { text-decoration: none; display: block; aspect-ratio: 1 / 1; }
        
        .cell {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2e3440 0%, #1a1d24 100%);
            border: 1px solid #434c5e;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 7px;
            font-weight: bold;
            color: #d8dee9;
            cursor: pointer;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            transition: transform 0.15s;
        }
        .cell-link:hover .cell { transform: scale(1.06); z-index: 5; border-color: #ffd700; }

        /* AKTYWNE OKIENKA FIRM - METALE I LOGOTYPY */
        .cell.taken {
            background-color: #ffffff;
            background-size: 75% auto;
            background-repeat: no-repeat;
            background-position: center 30%;
            border: 2px solid #d8dee9;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
        }
        .cell.taken .company-title {
            position: absolute;
            bottom: 2px; width: 100%;
            font-size: 6.5px; font-weight: 800;
            color: #2e3440; text-transform: uppercase;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .cell.premium {
            border: 1px solid #ffd700;
            color: #ffd700;
            background: linear-gradient(135deg, #3b4252 0%, #1a1d24 100%);
        }

        /* GŁÓWNY ZŁOTY EKRAN CENTRALNY */
        .center-banner {
            grid-column: span 4;
            grid-row: span 4;
            background: linear-gradient(135deg, #0a0c10 0%, #151922 100%);
            border: 3px solid #ffd700;
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.45), inset 0 0 15px rgba(255, 215, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        .center-banner .gold-crown {
            color: #ffd700; font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
            background: rgba(255,215,0,0.1); width: 100%; padding: 3px 0; border-bottom: 1px dashed #ffd700;
        }

        .center-banner .jackpot-box {
            margin: 5px 0;
        }
        .center-banner .jackpot-title {
            font-size: 15px; font-weight: 900; color: #ffd700; letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .center-banner .jackpot-value {
            font-size: 11px; color: #fff; font-weight: bold; margin-top: 2px;
        }

        /* ZEGAR ODLICZANIA LIVE */
        .live-countdown {
            background: #ef4444; color: #fff; font-family: monospace;
            font-size: 14px; font-weight: bold; padding: 4px 10px;
            border-radius: 3px; border: 1px solid #f87171;
            letter-spacing: 1px; box-shadow: 0 0 10px rgba(239,68,68,0.4);
        }

        /* PANEL BOCZNY - KOŁO FORTUNY */
        .sidebar {
            width: 100%; max-width: 320px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .wheel-box {
            background: rgba(20,24,33,0.95);
            border: 2px solid #2c3e50;
            border-radius: 6px; padding: 15px; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .wheel-box h3 { font-size: 14px; color: #ffd700; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; }

        .wheel-container { position: relative; width: 220px; height: 220px; margin: 0 auto; }
        .wheel-canvas {
            width: 220px; height: 220px; border-radius: 50%;
            border: 5px solid #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3);
            transition: transform 4.5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .wheel-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid #ffd700; z-index: 20; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .spin-btn {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000; border: none; padding: 11px 24px; font-size: 13px; font-weight: 900;
            border-radius: 25px; cursor: pointer; margin-top: 15px; width: 100%;
            box-shadow: 0 5px 15px rgba(255,140,0,0.4); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .spin-btn:disabled { background: #4c566a; color: #434c5e; cursor: not-allowed; box-shadow: none; }

        /* POPUP WYGRANEGO VOUCHERA (Z TRZECIEGO UJĘCIA) */
        #winner-popup {
            display: none;
            background: linear-gradient(135deg, #11141b 0%, #1f2430 100%);
            border: 2px solid #ffd700; border-radius: 6px; padding: 12px; margin-top: 12px;
            box-shadow: 0 0 20px rgba(255,215,0,0.3); animation: fadeIn 0.4s ease;
        }
        .popup-title { color: #ffd700; font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .popup-name { color: #fff; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.06); padding: 5px; border-radius: 4px; }

        /* DOLNY INTERAKTYWNY SKŁADNIK MUZYCZNY */
        .audio-dock {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15,17,21,0.92); border-top: 1px solid #ffd700;
            padding: 8px 20px; display: flex; justify-content: center; align-items: center;
            gap: 15px; z-index: 100; box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        .audio-dock span { font-size: 11px; color: #ffd700; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; }
        .audio-dock audio { height: 28px; max-width: 240px; }

        /* STOPKA REZERWACYJNA */
        .billboard-footer-bar {
            background: #11141b; border: 1px solid #2c3e50; text-align: center;
            padding: 8px; margin-top: 15px; font-size: 12px; font-weight: bold; color: #eaeded;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .billboard-footer-bar span { color: #ffd700; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- GŁÓWNA STRUKTURA BILLBOARDU -->
    <div class="billboard-frame">
        <div class="billboard-inner">
            
            <!-- NAGŁÓWEK TABLICY -->
            <div class="billboard-top-bar" id="top-title-text">TABLICA REKLAMOWA KORONY KARKONOSZY</div>

            <!-- WIDOK MAPY SELEKCYJNEJ -->
            <div id="map-view">
                <h1>Wybierz punkt docelowy platformy</h1>
                <div class="map-container">
                    <div class="city-pin" id="pin-karpacz" onclick="openPlatform('Karpacz')"><div class="city-label">Karpacz</div></div>
                    <div class="city-pin" id="pin-zakopane" onclick="openPlatform('Zakopane')"><div class="city-label">Zakopane</div></div>
                </div>
            </div>

            <!-- WIDOK PANELU GŁÓWNEGO -->
            <div id="dashboard-view">
                <button class="back-btn" onclick="returnToMap()">← Powrót do mapy punktów</button>

                <div class="layout-grid">
                    
                    <!-- SIATKA REKLAMOWA -->
                    <div class="grid-board" id="board-container"></div>

                    <!-- PANEL SENSACYJNEGO KOŁA FORTUNY -->
                    <div class="sidebar">
                        <div class="wheel-box">
                            <h3>🎁 KOŁO LOSOWANIA VOUCHERÓW</h3>
                            <div class="wheel-pointer"></div>
                            <div class="wheel-container">
                                <canvas class="wheel-canvas" id="voucherWheel" width="220" height="220"></canvas>
                            </div>
                            <button class="spin-btn" id="spinBtn" onclick="runVoucherLottery()">LOSUJ NAGRODĘ WIDZA</button>
                            
                            <!-- PANEL WYGRANEJ Z TRZECIEGO ZDJĘCIA -->
                            <div id="winner-popup">
                                <div class="popup-title">🎁 ZWYCIĘZCA WIDZÓW:</div>
                                <div class="popup-name" id="winner-target-user">[@ZUZANNA_KRZECZYK]</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- PASEK DOLNY REZERWACYJNY -->
            <div class="billboard-footer-bar">ZAREZERWUJ OKIENKO NA NASZEJ STRONIE: <span>POLSKIEOKIENKA.PL</span></div>

        </div>
    </div>

    <!-- INTEGRACJA PODKŁADU MUZYCZNEGO (PHONK / SIGMA BEAT) -->
    <div class="audio-dock">
        <span>🎵 Podkład Magiczny (Karkonosze Flow):</span>
        <audio controls loop>
            <!-- Legalny, darmowy i działający strumień muzyki instrumentalnej synthwave/phonk-ambient -->
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Twoja przeglądarka nie obsługuje audio.
        </audio>
    </div>

    <script>
        // Realne podmioty z branży i profesjonalne ikony brandingowe ze zbiorów Unsplash
        const businessDatabase = [
            { name: "Wonder Home", url: "https://www.wonderhome.pl", logo: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=60&auto=format&fit=crop&q=60" },
            { name: "Karczma Karkonoska", url: "https://www.google.com/maps", logo: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=60&auto=format&fit=crop&q=60" },
            { name: "Aparthotel Śnieżka", url: "https://www.google.com/maps", logo: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=60&auto=format&fit=crop&q=60" },
            { name: "Kopa Pass", url: "https://kopa.com.pl", logo: "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=60&auto=format&fit=crop&q=60" },
            { name: "Ski School", url: "https://www.google.com/maps", logo: "https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=60&auto=format&fit=crop&q=60" },
            { name: "Coffee Shop", url: "https://www.google.com/maps", logo: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=60&auto=format&fit=crop&q=60" }
        ];

        // Wykaz Voucherów na Kole Fortuny (wartości podkręcające akcję)
        const voucherPrizes = [
            "Hotel Gołębiewski 500zł",
            "Pobyt Wonder Home",
            "Kolacja w Karczmie",
            "Kopa Pass - Ski",
            "Voucher Premium 350zł",
            "Gadżety PolskieOkienka"
        ];

        // Przykładowa pula aktywnych widzów do wylosowania na żywo
        const mockViewers = ["@ZUZANNA_KRZECZYK", "@MARCIN_KOWARY", "@SIGMA_TRAVELER", "@ANNA_KARKONOSZE", "@MATEO_REELS"];

        let countdownInterval;

        function openPlatform(cityName) {
            document.getElementById('map-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('top-title-text').innerText = `TABLICA REKLAMOWA ${cityName.toUpperCase()}`;
            
            buildGrid();
            renderVoucherWheel();
            startLiveTimer();
        }

        function returnToMap() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('map-view').style.display = 'flex';
            document.getElementById('top-title-text').innerText = "TABLICA REKLAMOWA KORONY KARKONOSZY";
            clearInterval(countdownInterval);
        }

        // GENEROWANIE PLANU ARCHITEKTONICZNEGO OKIENEK
        function buildGrid() {
            const container = document.getElementById('board-container');
            container.innerHTML = "";
            let cellIndex = 1;

            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 10; col++) {
                    // Budowanie strefy centralnego złotego ekranu 4x4
                    if (row >= 3 && row <= 6 && col >= 3 && col <= 6) {
                        if (row === 3 && col === 3) {
                            const centerBox = document.createElement('div');
                            centerBox.className = 'center-banner';
                            centerBox.innerHTML = `
                                <div class="gold-crown">Główna Nagroda Reklamodawcy</div>
                                <div class="jackpot-box">
                                    <div class="jackpot-title">MILION ZŁOTYCH</div>
                                    <div class="jackpot-value">LOSOWANIE MIESIĘCZNE</div>
                                </div>
                                <div class="live-countdown" id="live-clock">00:00:04:00</div>
                            `;
                            container.appendChild(centerBox);
                        }
                    } else {
                        const link = document.createElement('a');
                        link.className = 'cell-link';
                        const item = document.createElement('div');

                        if (cellIndex % 3 === 0) {
                            const data = businessDatabase[cellIndex % businessDatabase.length];
                            item.className = 'cell taken';
                            item.style.backgroundImage = `url('${data.logo}')`;
                            item.innerHTML = `<div class="company-title">${data.name}</div>`;
                            link.href = data.url;
                            link.target = "_blank";
                        } else {
                            const premiumNode = cellIndex % 7 === 0;
                            item.className = 'cell' + (premiumNode ? ' premium' : '');
                            item.innerHTML = premiumNode ? 'PREMIUM' : 'STANDARD';
                            link.href = "javascript:void(0);";
                            link.onclick = () => alert("Zarezerwuj to okienko reklamowe na stronie głównej!");
                        }

                        link.appendChild(item);
                        container.appendChild(link);
                        cellIndex++;
                    }
                }
            }
        }

        // RYSOWANIE LUKSUSOWEGO KOŁA FORTUNY (Złoto i Granat)
        const canvas = document.getElementById('voucherWheel');
        const ctx = canvas.getContext('2d');
        const wheelColors
