<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogólnopolska Sieć Tablic Reklamowych | Kup Okienko</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181c24;
            --accent-color: #00ecff;
            --accent-gold: #ffd700;
            --text-color: #f5f6f8;
            --border-color: #262f3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 1200px;
            width: 100%;
        }

        header {
            text-align: center;
            margin: 40px 0;
        }

        header h1 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--accent-color);
        }

        /* Ulepszony panel wyboru regionu */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box input {
            background: #0f1115;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            width: 250px;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .stats-badge {
            background: rgba(0, 236, 255, 0.1);
            border: 1px solid var(--accent-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Główna Siatka 100 okienek */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            background: #0b0d10;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #6c7a90;
            text-decoration: none;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        .box:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0, 236, 255, 0.2);
            color: #fff;
        }

        /* Styl dla wykupionego okienka */
        .box.occupied {
            background: #1c2331;
            border-color: #3b485e;
            color: #fff;
            font-weight: 600;
        }

        .box.occupied::after {
            content: "🔹";
            font-size: 9px;
            margin-top: 4px;
        }

        /* Środkowy Mega-Kafel */
        .box.main-sponsor {
            grid-column: span 4;
            grid-row: span 4;
            background: linear-gradient(135deg, #1e0044 0%, #440047 100%);
            border: 2px solid var(--accent-gold);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        /* Modal zakupowy */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            padding: 30px;
            border-radius: 16px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            background: #0f1115;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .modal button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 id="dynamic-heading">Tablica Ogłoszeń: <span>Karpacz</span></h1>
        <p>Zabezpiecz pozycję swojej firmy w regionie. Ruch bezpośredni bez pośredników.</p>
    </header>

    <div class="controls-panel">
        <div class="search-box">
            <input type="text" id="region-search" placeholder="🔍 Wpisz miasto (np. Karpacz, Szklarska)..." oninput="filterRegions()">
        </div>
        <div class="stats-badge" id="counter-badge">🚨 Wolne okienka: 94/100</div>
    </div>

    <div class="grid-container" id="main-grid">
        </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="order-modal">
    <h3 style="margin-top:0; color:var(--accent-color)">📥 Rezerwacja Kafelka</h3>
    <p>Wybrałeś miejsce reklamowe. Wpisz dane, aby przejść do płatności BLIK/Karta.</p>
    
    <label>Nazwa Twojego biznesu:</label>
    <input type="text" id="biz-name" placeholder="np. Hotel Śnieżka">
    
    <label>Adres URL strony lub Facebooka:</label>
    <input type="text" id="biz-url" placeholder="https://...">
    
    <button onclick="executePayment()">💳 OPŁAĆ ABONAMENT (50 ZŁ)</button>
</div>

<script>
    // Centralna baza danych regionów Polski - czysty obiekt gotowy na rozbudowę
    const regiony = {
        "karpacz": {
            name: "Karpacz i Karkonosze",
            occupied: {
                1: { name: "🍺 Browar Sowiduch", url: "#" },
                2: { name: "🏰 Park Miniatur", url: "#" },
                5: { name: "🎿 Wyciąg Winter-Pol", url: "#" }
            }
        },
        "szklarska": {
            name: "Szklarska Poręba",
            occupied: {
                3: { name: "🌲 Wodospad Kamieńczyka", url: "#" },
                8: { name: "🍕 Pizzeria Harnaś", url: "#" }
            }
        },
        "zakopane": {
            name: "Zakopane i Podhale",
            occupied: {
                4: { name: "🚠 Kasprowy Wierch", url: "#" }
            }
        }
    };

    let currentRegion = "karpacz";

    function buildGrid(regionKey) {
        const grid = document.getElementById('main-grid');
        const heading = document.getElementById('dynamic-heading');
        const data = regiony[regionKey];
        
        heading.innerHTML = `Tablica Ogłoszeń: <span>${data.name}</span>`;
        grid.innerHTML = "";

        let occupiedCount = 0;

        // Budujemy dokładnie 100 okienek w systemie CSS Grid
        for (let i = 1; i <= 97; i++) {
            
            // Wrzucamy główny kafel na stałą pozycję (np. jako 13 element siatki)
            if(i === 13) {
                const mainSponsor = document.createElement('div');
                mainSponsor.className = "box main-sponsor";
                mainSponsor.innerHTML = "👑 REKLAMA GŁÓWNA<br><span style='font-size:12px; color:var(--accent-gold);'>Wylosowana Nagroda Miesiąca</span>";
                grid.appendChild(mainSponsor);
            }

            const cell = document.createElement('a');
            cell.href = "#";
            
            if(data.occupied[i]) {
                cell.className = "box occupied";
                cell.innerText = data.occupied[i].name;
                cell.href = data.occupied[i].url;
                cell.target = "_blank";
                occupiedCount++;
            } else {
                cell.className = "box";
                cell.innerHTML = `Wolne<br><span style="color:var(--accent-color)">Kup slot</span>`;
                cell.onclick = function(e) {
                    e.preventDefault();
                    openModal();
                };
            }
            grid.appendChild(cell);
        }

        // Aktualizacja licznika wolnych miejsc w locie
        document.getElementById('counter-badge').innerText = `🚨 Wolne okienka: ${97 - occupiedCount}/100`;
    }

    function filterRegions() {
        const input = document.getElementById('region-search').value.toLowerCase();
        // Szybkie dopasowanie wpisanego tekstu do kluczy w bazie danych
        for (let key in regiony) {
            if(regiony[key].name.toLowerCase().includes(input)) {
                currentRegion = key;
                buildGrid(currentRegion);
                break;
            }
        }
    }

    function openModal() {
        document.getElementById('order-modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('order-modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function executePayment() {
        const name = document.getElementById('biz-name').value;
        const url = document.getElementById('biz-url').value;
        if(!name || !url) {
            alert("Uzupełnij pola, wspólniku! Musimy wiedzieć, kto płaci.");
            return;
        }
        // Przekierowanie na zewnętrzny, bezpieczny link Stripe
        window.location.href = "https://buy.stripe.com/test_link_reklamowy";
    }

    // Inicjalizacja systemu na starcie
    buildGrid(currentRegion);
</script>

</body>
</html>
