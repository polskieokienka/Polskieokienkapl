        body {

        .lang-flag { font-size: 20px; cursor: pointer; transition: transform 0.2s, filter 0.2s; filter: grayscale(50%); }

        /* SEKCJA MAPY */

            display: flex;

            margin: 0 0 20px 0;

        .map-container {

        .poland-svg-bg {

            z-index: 1; pointer-events: none;
        }

        /* PINEZKI */
        .city-pin {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            background: none; border: none; padding: 0; margin: 0;
            cursor: pointer; outline: none;
        }
        
        .pin-dot {
            width: 14px; height: 14px;
            background-color: #d4af37; border: 2px solid #050608; border-radius: 50%;

        .city-label {

        }

        .lbl-top { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .lbl-bottom { top: 20px; left: 50%; transform: translateX(-50%); }
        .lbl-left { right: 20px; top: 50%; transform: translateY(-50%); }
        .lbl-right { left: 20px; top: 50%; transform: translateY(-50%); }
        .lbl-szklarska { bottom: 20px; right: -20px; transform: translateX(0); }
        .lbl-karpacz { top: 20px; left: 50%; transform: translateX(-50%); }
        .lbl-swieradow { bottom: 20px; left: -30px; transform: translateX(0); }

        .city-pin:hover .pin-dot { transform: scale(1.5); background-color: #ffffff; box-shadow: 0 0 20px #ffffff; }
        .city-pin:hover .city-label { background: #d4af37; color: #000000; font-size: 11px; box-shadow: 0 0 20px rgba(212,175,55,0.8); z-index: 50; }

        #pin-swinoujscie { top: 18%; left: 8%; }

        /* STREFA TURYSTY */
        .tourist-zone {
            width: 100%; max-width: 1400px; margin: 25px 0;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; box-sizing: border-box;

        .tourist-panel {

        }

        .weather-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .weather-temp { font-size: 26px; font-weight: bold; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* Szlaki w wersji ekskluzywnej czarno-złotej zamiast jaskrawej zieleni */
        .trail-status { background: rgba(212, 175, 55, 0.1); color: #d4af37; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; border: 1px solid rgba(212, 175, 55, 0.4); }

        .bus-list { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }

        .bus-time { color: #d4af37; font-weight: bold; }

        .trail-select { width: 100%; padding: 10px; background: #050608; border: 1px solid #1c1f26; border-radius: 6px; color: #fff; font-size: 12px; margin-bottom: 12px; outline: none; }
        .trail-select:focus { border-color: #d4af37; }
        .trail-result { font-size: 12px; color: #9ca3af; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; min-height: 40px; border: 1px solid #1c1f26; }

        /* PANEL RETINA BILLBOARD */
        #dashboard-view { display: none; width: 100%; max-width: 1450px; }
        
        .back-btn {
            background: #0b0c10; color: #d4af37; border: 1px solid #d4af37;
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;
            margin-bottom: 15px; transition: all 0.2s; text-transform: uppercase; font-size: 12px;
            letter-spacing: 0.5px;
        }
        .back-btn:hover { background: #d4af37; color: #000000; box-shadow: 0 0 15px rgba(212,175,55,0.4); }

        /* ZŁOTA RAMA BILLBOARDU */

        .billboard-inner { background-color: #0b0c10; border: 2px solid #1c1f26; padding: 15px; border-radius: 8px; }

        .cell-link { text-decoration: none; display: block; width: 100%; height: 100%; }

        .grid-item {

        /* SIDEBAR KOŁA */
        .wheels-sidebar { display: flex; flex-direction: column; gap: 20px; flex: 0.8; width: 100%; }

        .wheel-card:hover { border-color: #d4af37; }
        .wheel-card h3 { font-size: 12px; color: #d4af37; margin: 0 0 12px 0; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; }

        /* Usunąłem zielone odcienie z Koła 2, żeby cała strona trzymała spójny czarno-złoty luksusowy design */
        .wheel-card.tourist-card { border-color: #1c1f26; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }

        .wheel-box { position: relative; width: 170px; height: 170px; margin-bottom: 12px; }

        .wheel-pointer {

            border-top: 15px solid #d4af37; z-index: 20;
        }
        .wheel-card.tourist-card .wheel-pointer { border-top-color: #d4af37; }

        .btn {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #a67c1e 100%); color: #000000;
            border: none; padding: 10px 16px; font-size: 11px; font-weight: 900;
            border-radius: 20px; cursor: pointer; width: 100%; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212,175,55,0.2); transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.4); }

        }
        .wheel-card.tourist-card .result-display { border-color: #d4af37; }
        .result-display a { color: #d4af37; font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 4px; }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

            position: relative; transform: translateY(-30px); transition: transform 0.3s ease; color: #ffffff;
        }
