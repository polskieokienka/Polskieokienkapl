<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Główna Matryca Kurortów</title>
    
    <!-- Biblioteka konfetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-darker: #050608;
            --bg-panel: rgba(15, 17, 24, 0.95);
            --text-main: #f3f4f6;
            --green-live: #2ecc71;
            --diamond-color: #b9f2ff;
        }

        body {
            background: radial-gradient(circle at top, #161925 0%, #08090d 60%, #020203 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        /* NAGŁÓWEK */
        .header-panel {
            background: linear-gradient(135deg, #12151f 0%, #07080c 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12);
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h2 { 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: #ffffff; 
            font-size: 24px;
        }
        
        .stats-container { display: flex; gap: 25px; font-size: 13px; font-weight: 600; }
        .stat-item { display: flex; align-items: center; gap: 8px; color: #9ca3af; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; }
        .stat-item span.stat-value { color: var(--gold-primary); font-size: 15px; font-weight: 800; }

        /* LISTA MIAST */
        #map-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 60px rgba(0,0,0,0.85);
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        .map-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .city-pin {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            background: rgba(18, 21, 31, 0.8);
            border: 1px solid var(--gold-primary);
            padding: 14px 18px;
            border-radius: 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.2s;
        }

        .city-pin:hover { background: var(--gold-primary); }
        .pin-dot { width: 12px; height: 12px; background-color: var(--gold-primary); border-radius: 50%; margin-right: 15px; flex-shrink: 0; }
        .city-pin:hover .pin-dot { background-color: #000; }
        .city-label { color: #fff; font-size: 14px; font-weight: 800; text-transform: uppercase; }
        .city-pin:hover .city-label { color: #000; }

        @media (min-width: 769px) {
            .map-container { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 15px; }
            .city-pin { width: calc(25% - 15px); min-width: 180px; }
        }

        /* PANEL MATRYCY */
        #dashboard-view { display: block; width: 100%; max-width: 1450px; margin-top: 20px; box-sizing: border-box; }
        
        .billboard-frame {
            background: linear-gradient(135deg, #a67c1e 0%, #f3e5ab 25%, #d4af37 50%, #f3e5ab 75%, #aa7c11 100%);
            padding: 14px; border-radius: 18px; box-shadow: 0 35px 80px rgba(0,0,0,0.95); border: 2px solid #73540b;
            width: 100%; box-sizing: border-box; overflow-x: auto;
        }

        .billboard-inner { background-color: #07080c; border: 2px solid #161822; padding: 20px; border-radius: 10px; min-width: 650px; }
        
        /* SIATKA OKIENEK */
        .grid-board {
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            grid-auto-rows: minmax(60px, auto);
            gap: 8px; background-color: #030405; padding: 12px; border-radius: 10px;
            border: 2px solid #14161f; width: 100%; box-sizing: border-box;
        }

        .grid-item {
            height: 100%; background: linear-gradient(135deg, #131620 0%, #07080b 100%);
            border: 1px solid #1f2433; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: #6b7280; cursor: pointer; transition: all 0.15s; padding: 5px; box-sizing: border-box; text-align: center;
            position: relative; overflow: hidden;
        }
        .grid-item:hover { transform: scale(1.04); border-color: var(--gold-primary); color: #fff; box-shadow: 0 0 10px rgba(212,175,55,0.3); }
        
        .grid-item.standard-vacant { border: 1px solid #232838; color: #4b5563; }
        
        .grid-item.gold-vacant { 
            border: 2px solid rgba(212, 175, 55, 0.4); 
            color: rgba(212, 175, 55, 0.6);
            box-shadow: inset 0 0 5px rgba(212,175,55,0.1);
        }

        .grid-item.standard-active { border: 1px solid #4b5563; color: #f3f4f6; background: rgba(31, 41, 55, 0.4); }
        
        .grid-item.gold-active { 
            border: 2px solid var(--gold-primary); 
            color: #fff; 
            background: linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(7,8,12,0.9) 100%);
            box-shadow: inset 0 0 10px rgba(212,175,55,0.3), 0 0 8px rgba(212,175,55,0.2);
        }

        /* Dedykowany styl dla graficznego logo Clean Expert */
        .grid-item-logo-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .grid-item-logo-img {
            max-width: 90%;
            max-height: 28px;
            object-fit: contain;
            border-radius: 2px;
            margin-bottom: 2px;
        }

        /* ŚRODEK VIP */
        .grid-center {
            grid-column: 4 / span 4; grid-row: 4 / span 4;
            background: linear-gradient(135deg, #07090e 0%, #1a233a 50%, #07090e 100%);
            border: 3px solid var(--gold-primary); border-radius: 12px; padding: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box;
            box-shadow: 0 0 30px rgba(185, 242, 255, 0.2);
            transition: all 0.5s ease;
        }
        .grid-center.diamond-mode {
            border-color: var(--diamond-color);
            background: linear-gradient(135deg, #111625 0%, #2a3a5c 50%, #111625 100%);
            box-shadow: 0 0 35px rgba(185, 242, 255, 0.5);
        }
        .vip-crown { color: var(--gold-primary); font-size: 11px; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px;}
        .vip-company { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase; }

        /* MODAL REZERWACJI */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #0f121d; border: 2px solid var(--gold-primary); border-radius: 16px; width: 95%; max-width: 480px; padding: 25px; box-sizing: border-box; text-align: center; }
        .modal-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #050609; border: 1px solid #232838; border-radius: 8px; color: #fff; box-sizing: border-box; }
        .modal-select { width: 100%; padding: 12px; margin-bottom: 15px; background: #050609; border: 1px solid #232838; border-radius: 8px; color: #fff; box-sizing: border-box; }
        
        .price-display { margin: 15px 0; font-size: 18px; font-weight: bold; color: var(--gold-primary); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; }
        .btn-buy-confirm { background: var(--green-live); color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; font-size: 13px; }
        .btn-buy-cancel { background: #333; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; }

        .logo-placeholder { font-size: 12px; letter-spacing: 1px; color: #fff; font-weight: 800; margin-top: 2px; text-transform: uppercase; }
        .badge-type { font-size: 8px; text-transform: uppercase; padding: 2px 6px; border-radius: 10px; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- PANEL GÓRNY -->
    <div class="header-panel">
        <div class="header-left">
            <h2>PolskieOkienka.pl - Główna Matryca Kurortów</h2>
            <div class="stats-container">
                <div class="stat-item">Zajęte Okienka: <span class="stat-value" id="statsOccupied">0</span> / 84</div>
                <button onclick="drawMonthlyVipWinner()" style="background: var(--gold-dark); border: none; color: #000; font-weight: bold; padding: 5px 15px; border-radius: 12px; cursor: pointer; margin-left: 10px; font-size: 11px; text-transform: uppercase;">
                    🎲 Losuj Telebim VIP (Co miesiąc)
                </button>
            </div>
        </div>
    </div>

    <!-- WYBÓR KURORTU -->
    <div id="map-view">
        <h3 style="margin: 0 0 15px 0; font-size: 16px; text-transform: uppercase; color: var(--gold-primary);">Wybierz kurort:</h3>
        <div class="map-container">
            <div class="city-pin" onclick="selectCity('Świnoujście')"><div class="pin-dot"></div><div class="city-label">Świnoujście</div></div>
            <div class="city-pin" onclick="selectCity('Kołobrzeg')"><div class="pin-dot"></div><div class="city-label">Kołobrzeg</div></div>
            <div class="city-pin" onclick="selectCity('Sopot')"><div class="pin-dot"></div><div class="city-label">Sopot</div></div>
            <div class="city-pin" onclick="selectCity('Świeradów-Zdrój')"><div class="pin-dot"></div><div class="city-label">Świeradów-Zdrój</div></div>
            <div class="city-pin" onclick="selectCity('Szklarska Poręba')"><div class="pin-dot"></div><div class="city-label">Szklarska Poręba</div></div>
            <div class="city-pin" onclick="selectCity('Karpacz')"><div class="pin-dot"></div><div class="city-label">Karpacz</div></div>
            <div class="city-pin" onclick="selectCity('Wisła')"><div class="pin-dot"></div><div class="city-label">Wisła</div></div>
            <div class="city-pin" onclick="selectCity('Zakopane')"><div class="pin-dot"></div><div class="city-label">Zakopane</div></div>
        </div>
    </div>

    <!-- MATRYCA -->
    <div id="dashboard-view">
        <div style="margin-bottom: 12px; font-weight: bold; color: var(--gold-primary); text-transform: uppercase; letter-spacing: 1px;">
            Bieżąca Tablica: <span id="currentCityLabel" style="color:#fff;">Karpacz</span>
        </div>
        <div class="billboard-frame">
            <div class="billboard-inner">
                <div class="grid-board" id="boardMatrix"></div>
            </div>
        </div>
    </div>

    <!-- MODAL REZERWACJI -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-box">
            <h3 id="modalTitle" style="color: var(--gold-primary); margin-top: 0; text-transform:uppercase; font-size:16px;">Rezerwacja</h3>
            
            <div style="text-align: left; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px dashed #333; margin-bottom: 15px; font-size: 13px;">
                Strefa okienka: <span id="infoAdZone" style="font-weight:bold; color:#fff;">-</span><br>
                Cena bazowa: <span id="infoAdBasePrice" style="font-weight:bold; color:var(--gold-primary);">-</span> zł netto / msc
            </div>

            <input type="text" class="modal-input" id="inputBizName" placeholder="Wpisz nazwę swojej firmy (Logo)">
            <input type="url" class="modal-input" id="inputBizUrl" placeholder="Wpisz link URL do swojej strony (Opcjonalnie)">

            <label style="display:block; text-align:left; font-size:12px; margin-bottom:5px; color:#ccc;">Połącz sąsiednie okienka w jedno duże pod logo:</label>
            <select class="modal-select" id="selectMergeQty" onchange="updatePriceCalculation()"></select>
            
            <div class="price-display">
                Suma: <span id="calculatedPrice">0</span> zł netto / miesiąc
            </div>
            
            <button class="btn-buy-confirm" onclick="confirmAdPurchase()">Aktywuj subskrypcję i dodaj logo</button>
            <button class="btn-buy-cancel" onclick="closeModal()">Anuluj</button>
        </div>
    </div>

    <script>
        let currentCity = "Karpacz";
        let selectedCell = null;

        // BAZA DANYCH - Clean Expert dodany na stałe do bazy w Karpaczu pod okienko nr 1
        const cityBoards = {
            "Karpacz": {
                1: {
                    name: "CLEAN EXPERT",
                    url: "https://sprzatanie.jelenia.pl/",
                    logoImg: "pobrane.jpeg", // Referencja do pliku pobrane.jpeg
                    qty: 1,
                    isChild: false
                }
            }, 
            "Szklarska Poręba": {}, "Świeradów-Zdrój": {}, "Świnoujście": {}, "Kołobrzeg": {}, "Sopot": {}, "Wisła": {}, "Zakopane": {}
        };

        const vipWinners = {
            "Karpacz": null, "Szklarska Poręba": null, "Świeradów-Zdrój": null, "Świnoujście": null, "Kołobrzeg": null, "Sopot": null, "Wisła": null, "Zakopane": null
        };

        function buildMatrix() {
            const matrixContainer = document.getElementById('boardMatrix');
            if (!matrixContainer) return;
            matrixContainer.innerHTML = "";

            const currentData = cityBoards[currentCity] || {};
            let occupiedCount = 0;

            for (let i = 1; i <= 100; i++) {
                let row = Math.floor((i - 1) / 10) + 1;
                let col = ((i - 1) % 10) + 1;

                // 1. ŚRODEK VIP
                if (row >= 4 && row <= 7 && col >= 4 && col <= 7) {
                    if (row === 4 && col === 4) {
                        const centerVIP = document.createElement('div');
                        centerVIP.className = "grid-center";
                        centerVIP.id = "vipTelebim";
                        
                        const winner = vipWinners[currentCity];
                        if (winner) {
                            centerVIP.classList.add('diamond-mode');
                            centerVIP.innerHTML = `
                                <div class="vip-crown" style="color: var(--diamond-color); text-shadow: 0 0 10px rgba(185,242,255,0.8);">💎 TELEBIM VIP DIAMENT 💎</div>
                                <div class="vip-company">${winner}</div>
                                <div style="font-size:9px; color: #a5b4fc; margin-top:5px; font-weight:bold;">Wylosowany z subskrypcji</div>
                            `;
                        } else {
                            centerVIP.innerHTML = `
                                <div class="vip-crown">👑 TELEBIM VIP</div>
                                <div class="vip-company" style="color: var(--gold-primary); font-size:13px;">PolskieOkienka.pl</div>
                                <div style="font-size:9px; color:#6b7280; margin-top:5px;">Losowanie co miesiąc wśród firm</div>
                            `;
                        }
                        matrixContainer.appendChild(centerVIP);
                    }
                    continue;
                }

                if (currentData[i] && currentData[i].isChild) {
                    continue;
                }

                const cell = document.createElement('div');
                cell.className = "grid-item";

                const isGoldZone = (i >= 61); 

                // 2. OKIENKO ZAJĘTE
                if (currentData[i]) {
                    occupiedCount++;
                    
                    if (isGoldZone) {
                        cell.classList.add('gold-active');
                    } else {
                        cell.classList.add('standard-active');
                    }

                    if (currentData[i].qty > 1) {
                        cell.style.gridColumn = `span ${currentData[i].qty}`;
                    }

                    // Renderowanie graficznego logo jeśli istnieje (jak u Clean Expert)
                    if (currentData[i].logoImg) {
                        cell.innerHTML = `
                            <div class="grid-item-logo-container">
                                <img src="${currentData[i].logoImg}" class="grid-item-logo-img" alt="${currentData[i].name}">
                                <div class="logo-placeholder" style="font-size:10px;">${currentData[i].name}</div>
                            </div>
                        `;
                    } else {
                        cell.innerHTML = `
                            <div class="logo-placeholder">${currentData[i].name}</div>
                            <span class="badge-type" style="background: ${isGoldZone ? 'var(--gold-primary)' : '#4b5563'}; color: #000;">
                                ${isGoldZone ? '300 zł/msc' : '200 zł/msc'}
                            </span>
                        `;
                    }

                    // Obsługa przekierowania URL po kliknięciu
                    const targetUrl = currentData[i].url;
                    cell.onclick = () => {
                        if (targetUrl) {
                            window.open(targetUrl, '_blank');
                        } else {
                            alert(`Okienko zajęte przez subskrypcję: ${currentData[i].name}`);
                        }
                    };
                } else {
                    // 3. OKIENKO WOLNE
                    if (isGoldZone) {
                        cell.classList.add('gold-vacant');
                        cell.innerHTML = `<span>[${i}]</span><div style="font-size:8px; color:var(--gold-primary); margin-top:3px; font-weight:800;">300 zł</div>`;
                    } else {
                        cell.classList.add('standard-vacant');
                        cell.innerHTML = `<span>[${i}]</span><div style="font-size:8px; color:#4b5563; margin-top:3px;">200 zł</div>`;
                    }
                    cell.onclick = () => openPurchaseModal(i, isGoldZone);
                }

                matrixContainer.appendChild(cell);
            }

            const counterEl = document.getElementById('statsOccupied');
            if (counterEl) counterEl.innerText = occupiedCount;
        }

        function openPurchaseModal(index, isGoldZone) {
            selectedCell = index;
            const modal = document.getElementById('purchaseModal');
            
            document.getElementById('modalTitle').innerText = `Szybki Zakup Okienka [${index}]`;
            document.getElementById('infoAdZone').innerText = isGoldZone ? "Okienko Premium (Złota Ramka)" : "Okienko Standardowe";
            document.getElementById('infoAdBasePrice').innerText = isGoldZone ? "300" : "200";
            
            const currentColumn = ((index - 1) % 10) + 1;
            const maxAllowedMerge = Math.min(4, 11 - currentColumn);
            
            const mergeSelect = document.getElementById('selectMergeQty');
            mergeSelect.innerHTML = "";
            for (let m = 1; m <= maxAllowedMerge; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m === 1 ? "1 Okienko (Bez łączenia)" : `${m} Okienka obok siebie (Połączone w jedno duże LOGO)`;
                mergeSelect.appendChild(opt);
            }

            updatePriceCalculation();
            if (modal) modal.style.display = "flex";
        }

        function closeModal() {
            const modal = document.getElementById('purchaseModal');
            if (modal) modal.style.display = "none";
        }

        function updatePriceCalculation() {
            const index = selectedCell;
            const isGoldZone = (index >= 61);
            const qty = parseInt(document.getElementById('selectMergeQty').value) || 1;
            
            const basePrice = isGoldZone ? 300 : 200;
            document.getElementById('calculatedPrice').innerText = basePrice * qty;
        }

        function confirmAdPurchase() {
            const nameInput = document.getElementById('inputBizName');
            const urlInput = document.getElementById('inputBizUrl');
            const qty = parseInt(document.getElementById('selectMergeQty').value) || 1;
            const name = nameInput.value.trim().toUpperCase();
            let url = urlInput.value.trim();

            if (!name) {
                alert("Proszę podać nazwę firmy!");
                return;
            }

            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            cityBoards[currentCity][selectedCell] = {
                name: name,
                url: url || null,
                logoImg: null,
                qty: qty,
                isChild: false
            };

            for (let i = 1; i < qty; i++) {
                let nextIndex = selectedCell + i;
                cityBoards[currentCity][nextIndex] = { isChild: true };
            }

            if (typeof confetti === 'function') {
                confetti({ particleCount: 130, spread: 80, origin: { y: 0.6 } });
            }

            alert(`Sukces! Aktywowano subskrypcję dla firmy "${name}".`);
            
            closeModal();
            nameInput.value = "";
            urlInput.value = "";
            buildMatrix();
        }

        function drawMonthlyVipWinner() {
            const currentData = cityBoards[currentCity] || {};
            const activeCompanies = [];

            for (let key in currentData) {
                if (currentData[key] && !currentData[key].isChild && currentData[key].name) {
                    activeCompanies.push(currentData[key].name);
                }
            }

            if (activeCompanies.length === 0) {
                alert("Brak aktywnych subskrypcji w tym mieście!");
                return;
            }

            const randomIndex = Math.floor(Math.random() * activeCompanies.length);
            const winner = activeCompanies[randomIndex];
            
            vipWinners[currentCity] = winner;
            buildMatrix();
            
            if (typeof confetti === 'function') {
                confetti({ particleCount: 200, spread: 100, colors: ['#b9f2ff', '#d4af37', '#ffffff'] });
            }
            alert(`🎉 Losowanie VIP zakończone!\n\nWylosowano firmę: ${winner}`);
        }

        function selectCity(cityName) {
            currentCity = cityName;
            const label = document.getElementById('currentCityLabel');
            if (label) label.innerText = cityName;
            buildMatrix();
        }

        window.onload = function() {
            buildMatrix();
        };
    </script>
</body>
</html>
