<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Ogólnopolska Platforma Reklamowo-Turystyczna</title>
    <style>
        /* PODSTAWOWE CONFIGI I MOTYW ULTRA PREMIUM */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-darker: #050608;
            --bg-panel: rgba(15, 17, 24, 0.95);
            --border-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f3f4f6;
        }

        body {
            background: radial-gradient(circle at top, #161925 0%, #08090d 60%, #020203 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 90px;
        }

        /* NAGŁÓWEK GŁÓWNY */
        .header-panel {
            background: linear-gradient(135deg, #12151f 0%, #07080c 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.12), inset 0 1px 1px rgba(255,255,255,0.05);
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h2 { 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 24px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.7);
        }
        
        .stats-container { display: flex; gap: 25px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
        .stat-item { color: #9ca3af; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
        .stat-item span { color: var(--gold-primary); font-size: 15px; font-weight: 800; text-shadow: 0 0 8px rgba(212,175,55,0.3); }

        /* JĘZYKI */
        .lang-selector { 
            display: flex; 
            gap: 12px; 
            background: rgba(0,0,0,0.5); 
            padding: 8px 16px; 
            border-radius: 30px; 
            border: 1px solid rgba(212,175,55,0.3); 
        }
        .lang-flag { font-size: 22px; cursor: pointer; transition: transform 0.2s, filter 0.2s; filter: grayscale(40%); }
        .lang-flag:hover { transform: scale(1.25); filter: grayscale(0%); }
        .lang-flag.active { filter: grayscale(0%); transform: scale(1.15); border-bottom: 2px solid var(--gold-primary); }

        /* GŁÓWNY WIDOK: MAPA */
        #map-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 60px rgba(0,0,0,0.85);
            box-sizing: border-box;
            animation: fadeIn 0.5s ease;
            margin-bottom: 25px;
        }

        #map-view h1 { 
            color: var(--gold-primary); 
            font-size: 16px; 
            margin: 0 0 25px 0; 
            text-transform: uppercase; 
            text-align: center; 
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1.1 / 1;
            background: #040507;
            border: 2px solid #171a22;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.95);
        }

        .poland-svg-bg {
            position: absolute;
            top: 2%; left: 2%; width: 96%; height: 96%;
            z-index: 1; pointer-events: none;
        }

        /* PINEZKI */
        .city-pin {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            background: none; border: none; padding: 0; margin: 0;
            cursor: pointer; outline: none;
        }
        
        .pin-dot {
            width: 14px; height: 14px;
            background-color: var(--gold-primary); border: 2px solid #050608; border-radius: 50%;
            box-shadow: 0 0 15px var(--gold-primary), 0 0 5px var(--gold-dark);
            transition: all 0.2s ease; z-index: 2;
        }
        
        .city-label {
            color: #ffffff; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap;
            background: rgba(4, 5, 7, 0.95); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--gold-primary);
            box-shadow: 0 6px 15px rgba(0,0,0,0.8); transition: all 0.2s ease; position: absolute;
            letter-spacing: 0.5px;
        }

        .lbl-top { bottom: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-bottom { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-left { right: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-right { left: 22px; top: 50%; transform: translateY(-50%); }
        .lbl-szklarska { bottom: 22px; right: -25px; transform: translateX(0); }
        .lbl-karpacz { top: 22px; left: 50%; transform: translateX(-50%); }
        .lbl-swieradow { bottom: 22px; left: -35px; transform: translateX(0); }

        .city-pin:hover .pin-dot { transform: scale(1.6); background-color: #ffffff; box-shadow: 0 0 25px #ffffff; }
        .city-pin:hover .city-label { background: var(--gold-primary); color: #000000; font-weight: 900; box-shadow: 0 0 20px rgba(212,175,55,0.6); z-index: 50; }

        #pin-swinoujscie { top: 18%; left: 8%; }
        #pin-kolobrzeg   { top: 12%; left: 23%; }
        #pin-sopot        { top: 10%; left: 50%; }
        #pin-swieradow    { top: 73%; left: 10%; }
        #pin-szklarska    { top: 76%; left: 15%; }
        #pin-karpacz      { top: 79%; left: 21%; }
        #pin-wisla        { top: 86%; left: 51%; }
        #pin-zakopane     { top: 92%; left: 64%; }
        #pin-szccawnica   { top: 89%; left: 72%; }
        #pin-krynica      { top: 86%; left: 81%; }

        /* INTEGRACJA TURYSTYCZNA */
        .tourist-zone {
            width: 100%; max-width: 1400px; margin: 20px 0 30px 0;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; box-sizing: border-box;
        }

        .tourist-panel {
            background: linear-gradient(135deg, #12141c, #07080c); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px; padding: 22px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .tourist-panel:hover { border-color: var(--gold-primary); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.05); }

        .tourist-panel h3 {
            margin: 0 0 16px 0; color: var(--gold-primary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
