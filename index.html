<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolskieOkienka.pl - Ekskluzywna Matryca Premium i Przewodnik Turystyczny</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            /* Nowa ekskluzywna paleta barw */
            --gold-primary: #d4af37;
            --gold-dark: #aa7c11;
            --emerald-light: #50c878;
            --emerald-deep: #0b6623;
            --pearl-base: #f0ead6;
            --pearl-glow: #eae0c8;
            --diamond-cyan: #b9f2ff;
            --diamond-blue: #70d1f4;
            
            --bg-darker: #030508;
            --bg-panel: rgba(8, 11, 18, 0.96);
            --text-main: #f3f4f6;
            --green-live: #10b981;
            --blue-tourist: #2563eb;
            --danger-color: #ef4444;
        }

        body {
            background: radial-gradient(circle at top, #0d131a 0%, #05070a 65%, #010203 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 120px; 
        }

        /* ANIMACJA HIPNOTYZUJĄCEGO ZAKALENIA ŚWIATŁEM */
        @keyframes matrixGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NAWIGACJA */
        .main-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1400px;
        }

        .nav-btn {
            background: rgba(13, 17, 28, 0.8);
            border: 1px solid #1f2738;
            color: #9ca3af;
            padding: 11px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, var(--gold-primary), var(--emerald-light));
            color: #000;
            border-color: var(--diamond-cyan);
            box-shadow: 0 0 20px rgba(80, 200, 120, 0.4);
        }
        .nav-btn-user {
            margin-left: auto;
            background: #111827;
            color: #f3f4f6;
            border: 1px solid #374151;
        }

        /* HEADER PANEL */
        .header-panel {
            background: linear-gradient(135deg, #0a0d14 0%, #030407 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(214, 175, 55, 0.15);
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h2 { 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            background: linear-gradient(to right, #fff 20%, var(--gold-primary) 50%, var(--diamond-cyan) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
        }
        
        .stats-container { display: flex; align-items: center; gap: 15px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 8px; color: #9ca3af; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; }
        .stat-item span.stat-value { color: var(--emerald-light); font-size: 15px; font-weight: 800; }

        .live-widget {
            background: rgba(7, 9, 15, 0.8);
            border: 1px solid rgba(80, 200, 120, 0.3);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            gap: 14px;
            align-items: center;
            font-size: 13px;
        }
        .widget-highlight { color: var(--gold-primary); font-weight: bold; }

        /* LISTA MIAST (20 MIAST) */
        #map-view {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid var(--emerald-deep);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        .map-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            width: 100%;
            margin-top: 12px;
        }

        .city-pin {
            display: flex;
            align-items: center;
            background: rgba(13, 17, 26, 0.8);
            border: 1px solid #1f293d;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .city-pin:hover, .city-pin.active-city {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--emerald-deep) 100%);
            border-color: var(--diamond-cyan);
            box-shadow: 0 4px 12px rgba(80, 200, 120, 0.3);
        }
        .pin-dot { width: 8px; height: 8px; background-color: var(--diamond-cyan); border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        .city-pin:hover .pin-dot, .city-pin.active-city .pin-dot { background-color: #fff; box-shadow: 0 0 8px #fff; }
        .city-label { color: #cbd5e1; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .city-pin:hover .city-label, .city-pin.active-city .city-label { color: #fff; }

        /* WIDOKI */
        .app-view { display: none; width: 100%; max-width: 1400px; box-sizing: border-box; }
        .app-view.active-view { display: block; }

        /* TELEBIM DNIA PREMIUM */
        .main-telebim-frame {
            background: linear-gradient(270deg, var(--gold-primary), var(--emerald-light), var(--pearl-base), var(--diamond-cyan));
            background-size: 600% 600%;
            animation: matrixGlow 12s ease infinite;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 0 35px rgba(80, 200, 120, 0.25);
        }
        .main-telebim-inner {
            background: radial-gradient(circle, #090d16 0%, #020305 100%);
            border-radius: 10px;
            padding: 35px;
            text-align: center;
            position: relative;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .telebim-badge {
            position: absolute;
            top: 12px;
            background: linear-gradient(135deg, var(--gold-primary), var(--diamond-cyan));
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .telebim-title {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin: 0;
        }

        /* MATRYCA REKLAM */
        .billboard-frame {
            background: linear-gradient(270deg, var(--gold-primary) 0%, var(--emerald-light) 33%, var(--pearl-glow) 66%, var(--diamond-cyan) 100%);
            background-size: 400% 400%;
            animation: matrixGlow 8s ease infinite;
            padding: 10px; 
            border-radius: 20px; 
            box-shadow: 0 40px 90px rgba(0,0,0,0.95);
            width: 100%; 
            box-sizing: border-box; 
            overflow-x: auto;
        }
        .billboard-inner { background-color: #040609; padding: 12px; border-radius: 12px; min-width: 1000px; }
        
        .grid-board {
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            grid-template-rows: repeat(10, minmax(75px, auto));
            gap: 8px; background-color: #020305; padding: 12px; border-radius: 10px;
            width: 100%; box-sizing: border-box;
        }

        .grid-item {
            background: linear-gradient(135deg, #0e131f 0%, #04060a 100%);
            border: 1px solid #1b2336; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: #4b5563; cursor: pointer; transition: all 0.2s; padding: 6px; box-sizing: border-box; text-align: center;
            position: relative;
        }
        .grid-item:hover { 
            transform: scale(1.05); z-index: 5;
            border-color: var(--diamond-cyan); 
            box-shadow: 0 0 15px var(--emerald-light);
        }
        
        .grid-item.gold-vacant { 
            border: 1px dashed var(--gold-primary); color: var(--gold-primary);
            background: linear-gradient(135deg, rgba(214,175,55,0.04) 0%, #04060a 100%);
        }
        .grid-item.standard-vacant { 
            border: 1px dashed var(--emerald-light); color: var(--emerald-light);
            background: linear-gradient(135deg, rgba(80,200,120,0.03) 0%, #04060a 100%);
        }
        
        .grid-item.gold-active { 
            border: 2px solid var(--gold-primary); color: #fff; 
            background: linear-gradient(135deg, rgba(214,175,55,0.15) 0%, #05080e 100%);
            box-shadow: inset 0 0 8px rgba(214,175,55,0.2);
        }
        .grid-item.standard-active { 
            border: 2px solid var(--emerald-light); color: #fff; 
            background: linear-gradient(135deg, rgba(80,200,120,0.1) 0%, #05080e 100%);
            box-shadow: inset 0 0 8px rgba(80,200,120,0.15);
        }

        .grid-item-logo-img { max-width: 95%; max-height: 38px; object-fit: contain; border-radius: 4px; }

        /* STREFA TURYSTY LAYOUT */
        .tourist-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .tourist-grid { grid-template-columns: 380px 1fr; } }

        .tourist-panel {
            background: var(--bg-panel);
            border: 2px solid var(--blue-tourist);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .alert-box {
            background: rgba(239, 68, 68, 0.08); border: 1px solid var(--danger-color);
            border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 13px;
        }

        /* STRUKTURA KART ATRAKCJI, ZABYTKÓW I GASTRO */
        .trail-card, .bus-card, .food-card, .historic-card {
            background: rgba(255,255,255,0.01);
            border-radius: 8px; padding: 14px; margin-bottom: 15px; font-size: 13px;
            display: flex; flex-direction: column; gap: 6px; box-sizing: border-box;
            border-left: 4px solid var(--blue-tourist);
            border: 1px solid rgba(255,255,255,0.05);
            border-left-width: 4px;
        }
        .historic-card { border-left-color: var(--gold-primary); background: linear-gradient(90deg, rgba(214,175,55,0.03) 0%, transparent 100%); }
        .trail-card { border-left-color: var(--emerald-light); }
        .bus-card { border-left-color: var(--diamond-blue); }
        .food-card { border-left-color: #f59e0b; background: linear-gradient(90deg, rgba(245,158,11,0.02) 0%, transparent 100%); }

        .card-badge { font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 4px; color: #000; width: fit-content; text-transform: uppercase; }
        .stars-display { color: #ffcc00; font-size: 14px; font-weight: bold; }

        /* FORMULARZ OPINII GASTRO */
        .review-form
