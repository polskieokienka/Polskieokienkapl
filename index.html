<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLSKIEOKIENKA.PL - TABLICA: KARPACZ</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181c24;
            --accent-premium: #ffd700; /* Złoty dla Premium 350zł */
            --accent-standard: #4a5d78;  /* Szary/Niebieski dla Standard 200zł */
            --accent-free: #00ecff;      /* Jasnoniebieski dla wolnych */
            --text-color: #f5f6f8;
            --border-color: #262f3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 500px; /* Dopasowanie szerokości pod ekrany telefonów jak na screenie */
            width: 100%;
        }

        /* Styl górnego panelu ze screena */
        .main-header-panel {
            border: 3px solid var(--accent-premium);
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .main-header-panel h1 {
            font-size: 22px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .counter-text {
            color: var(--accent-premium);
            font-weight: bold;
            font-size: 18px;
        }

        .map-btn {
            width: 100%;
            background: #283446;
            border: 2px solid var(--accent-premium);
            color: var(--accent-premium);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            text-align: left;
        }

        /* Siatka tablicy */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            background: #0b0d10;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #6c7a90;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Styl dla okienek 350zł Premium */
        .box.premium-tier {
            border: 1px solid var(--accent-premium);
            color: var(--accent-premium);
        }

        /* Styl dla okienek 200zł Standard */
        .box.standard-tier {
            border: 1px solid var(--accent-standard);
            color: #fff;
        }

        /* Wyświetlanie logotypu (obrazka) wewnątrz kafelka */
        .box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Obrazek idealnie dopasuje się do kwadratu */
            display: block;
        }

        /* Środkowe Koło Fortuny / Baner Główny */
        .box.main-sponsor {
            grid-column: span 4;
            grid-row: span 4;
            background: linear-gradient(135deg, #1e0044 0%, #440047 100%);
            border: 2px solid var(--accent-premium);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }

        .wheel-img {
            width: 60px !important;
            height: 60px !important;
            margin: 5px 0;
        }

        /* Modal rezerwacji */
        .modal, .overlay { display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="main-header-panel">
        <h1>POLSKIEOKIENKA.PL -<br>TABLICA: KARPACZ</h1>
        <p>Licznik Gości w Sieci: <span class="counter-text">14 205</span> osób dzisiaj</p>
        <p>Wolne Okienka w Regionie: <span class="counter-text" id="counter-badge">81 / 100</span></p>
    </div>

    <button class="map-btn">← WRÓĆ DO MAPY POLSKI</button>

    <div class="grid-container" id="main-grid">
        <!-- Generowane przez skrypt JS -->
    </div>
</div>

<script>
    // Baza danych ułożona dokładnie pod ceny i Twoje firmy
    const regiony = {
        "karpacz": {
            name: "Karpacz",
            // Definiujemy status każdego okienka (typ ceny oraz przypisaną firmę z obrazkiem)
            slots: {
                1: { type: "premium", price: "350 zł", name: "Wonder Home", url: "https://www.wonderhome.pl", logo: "wonder_home.png" }, // Wonder Home w slocie 350zł Premium
                2: { type: "premium", price: "350 zł", name: "CleanExpert", url: "https://www.facebook.com", logo: "cleanexpert.png" },   // CleanExpert w slocie 350zł Premium
                3: { type: "premium", price: "350 zł", name: "Park Miniatur", url: "https://www.parkminiatur.com", logo: "park_miniatur.png" },
                4: { type: "standard", price: "200 zł", name: "Domki Widokowo", url: "https://www.facebook.com", logo: "domki_widokowo.png" },
                5: { type: "standard", price: "200 zł", name: "Wyspa Fun", url: "https://www.facebook.com", logo: "wyspa_fun.png" },
                // Pozostałe przykładowe konfiguracje ze screena
                6: { type: "standard", price: "200 zł", name: "Kolej Linowa", url: "#", logo: "kolej.png" },
                7: { type: "standard", price: "200 zł", name: "Schronisko", url: "#", logo: "schronisko.png" }
            }
        }
    };

    function buildGrid(regionKey) {
        const grid = document.getElementById('main-grid');
        const data = regiony[regionKey];
        grid.innerHTML = "";

        let occupiedCount = 0;

        for (let i = 1; i <= 97; i++) {
            
            // Środkowy duży Złoty Eksponat z kołem fortuny (pozycja 13)
            if(i === 13) {
                const mainSponsor = document.createElement('div');
                mainSponsor.className = "box main-sponsor";
                mainSponsor.innerHTML = `
                    <div style="font-size:7px; color:var(--accent-premium)">ZŁOTY BANER - NAGRODA GŁÓWNA</div>
                    <div style="font-size:9px; color:#fff; font-weight:bold;">ZŁOTY EKSPONAT</div>
                    <img src="kolo_fortuny.png" class="wheel-img" alt="Koło">
                    <div style="background:#222; padding:2px 8px; border-radius:4px; font-size:8px;">Wonder Home</div>
                `;
                mainSponsor.onclick = function() { window.open("https://www.wonderhome.pl", '_blank'); };
                grid.appendChild(mainSponsor);
            }

            const cell = document.createElement('a');
            cell.className = "box";

            // Sprawdzamy, czy dane okienko jest zdefiniowane w naszej bazie
            if (data.slots[i]) {
                const slotData = data.slots[i];
                occupiedCount++;

                cell.href = slotData.url;
                cell.target = "_blank";

                // KLUCZOWA ZMIANA: Próba załadowania pliku graficznego logo. 
                // Jeśli plik graficzny nie istnieje na serwerze, włącza się "onerror" i wyświetla estetyczny tekst zastępczy.
                const img = document.createElement('img');
                img.src = slotData.logo;
                img.alt = slotData.name;
                img.onerror = function() {
                    // Poniższy blok wykona się, jeśli zapomnisz wrzucić pliku .png do folderu na GitHubie
                    cell.innerHTML = `<div style="padding:2px; font-weight:bold;">${slotData.name}</div><div style="font-size:6px; color:#aaa;">${slotData.price}</div>`;
                };
                
                // Nadanie odpowiedniej ramki kolorystycznej w zależności od ceny
                if(slotData.type === "premium") {
                    cell.classList.add("premium-tier");
                } else {
                    cell.classList.add("standard-tier");
                }
                
                cell.appendChild(img);
            } else {
                // Generowanie losowych wolnych okienek Premium/Standard dla efektu wypełnienia jak na screenie
                if (i % 7 === 0) {
                    cell.classList.add("premium-tier");
                    cell.innerHTML = `350 zł<br>Premium`;
                } else {
                    cell.classList.add("standard-tier");
                    cell.innerHTML = `200 zł<br>Standard`;
                }
            }
            grid.appendChild(cell);
        }

        document.getElementById('counter-badge').innerText = `${100 - occupiedCount} / 100`;
    }

    buildGrid("karpacz");
</script>

</body>
</html>
