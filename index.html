        // GENEROWANIE SIATKI 100 OKIENEK + INTEGRACJA TELEBIMU CENTRALNEGO
        function generateDynamicGrid() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = '';

            // Wyciągamy z pamięci podręcznej strukturę Telebimu Centralnego
            const telebimHTML = document.getElementById('mainTelebim').outerHTML;

            for (let row = 1; row <= 100; row++) {
                // Warunek sprawdzający, czy trafiliśmy na współrzędne 4x4 na środku tablicy

                    const centerContainer = document.createElement('div');
                    centerContainer.style.gridColumn = "span 4";
                    centerContainer.style.gridRow = "span 4";
                    centerContainer.innerHTML = telebimHTML;
                    // Wyciągamy ukryty ID, żeby zapobiec duplikacji w DOM i nadajemy mu aktywność
                    centerContainer.querySelector('#mainTelebim').style.display = "flex";
                    grid.appendChild(centerContainer);
                    
                    // Przeskakujemy indeksy, które zajmuje Telebim Centralny (pole 4x4)
                    row += 3; 
                    continue; 
                }

                // Generowanie standardowych i premium slotów dookoła
                const cellIndex = row > 34 ? row + 36 : row; // offset indeksowania po wstawieniu telebimu
                if (cellIndex > 100) break;

                const link = document.createElement('a');
                link.href = "#";
                link.className = "cell-link";
                link.onclick = (e) => {
                    e.preventDefault();
                    openOrderModal('slot', cellIndex, cellIndex % 7 === 0 ? 'Premium' : 'Standard');
                };

                const item = document.createElement('div');
                item.className = "grid-item";

                // Wyróżnienie partnera Wonder Home w Karpaczu na określonym slocie
                if (currentCity === 'karpacz' && cellIndex === 12) {
                    item.classList.add('wonder-home-slot');
                    item.title = "Wonder Home Karpacz - Noclegi Premium";
                    item.style.color = "transparent";
                } else if (cellIndex % 7 === 0) {
                    item.classList.add('premium');
                    item.innerHTML = `<span>300 zł</span><span style="font-size:5px;opacity:0.6;">PROMO</span>`;
                } else {
                    item.innerHTML = `<span>Slot</span><span>${cellIndex}</span>`;
                }

                link.appendChild(item);
                grid.appendChild(link);
            }

            // Przeładuj rysowanie canvasów wewnątrz wygenerowanego właśnie telebimu
            setTimeout(() => {
                renderVectorWheel(document.querySelectorAll('#centerWheel')[1], itemsCenter, true);
                renderVectorWheel(document.getElementById('promoWheel'), itemsPromo, false);
                renderVectorWheel(document.getElementById('touristWheel'), itemsTourist, false);
            }, 50);
        }

        // PROSTOPADŁE RYSOWANIE TEKSTÓW NA CANVASECH KÓŁ FORTUNY
        function renderVectorWheel(canvas, itemList, isCenter) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const segments = itemList.length;
            const radius = canvas.width / 2;
            const angleStep = (2 * Math.PI) / segments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < segments; i++) {
                const startAngle = i * angleStep;
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 2, startAngle, startAngle + angleStep);
                ctx.closePath();

                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.fill();
                ctx.strokeStyle = isCenter ? "#ffd700" : (canvas.id === 'touristWheel' ? '#2ed573' : '#ffd700');
                ctx.lineWidth = 1;
                ctx.stroke();

                // Dodawanie etykiet tekstowych obróconych do środka
                ctx.save();
                ctx.translate(radius, radius);
                const middleAngle = startAngle + angleStep / 2;
                ctx.rotate(middleAngle);

                ctx.fillStyle = "#ffffff";
                ctx.font = isCenter ? "bold 7px sans-serif" : "bold 9px sans-serif";
                ctx.textBaseline = "middle";
                ctx.textAlign = "right";

                // Korekcja odbicia lustrzanego dla czytelności tekstu w pionie
                let normAngle = middleAngle % (2 * Math.PI);
                if (normAngle > Math.PI / 2 && normAngle < (3 * Math.PI) / 2) {
                    ctx.translate(radius - 22, 0);
                    ctx.rotate(Math.PI);
                    ctx.textAlign = "left";
                    ctx.fillText(itemList[i], 0, 0);
                } else {
                    ctx.fillText(itemList[i], radius - 10, 0);
                }
                ctx.restore();
            }
        }

        // PROCESY LOSOWANIA KÓŁ (ANIMACJA CSS + MATEMATYKA KĄTÓW)
        let spinningStates = { promo: false, tourist: false, center: false };

        function executeSpin(canvasId, btnId, resultId, items, stateKey) {
            if (spinningStates[stateKey]) return;
            spinningStates[stateKey] = true;

            const canvas = document.getElementById(canvasId) || document.querySelectorAll(`#${canvasId}`)[1];
            const btn = document.getElementById(btnId);
            const result = document.getElementById(resultId);

            if (btn) btn.disabled = true;
            if (result) result.style.display = "none";

            const deg = Math.floor(Math.random() * 360) + 1800; // Minimum 5 pełnych obrotów
            canvas.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                spinningStates[stateKey] = false;
                if (btn) btn.disabled = false;

                const step = 360 / items.length;
                const rest = deg % 360;
                // Obliczanie wybranego segmentu względem wskaźnika u góry (270 stopni)
                const targetIdx = Math.floor(((360 - rest + 270) % 360) / step) % items.length;

                if (result) {
                    result.innerHTML = `🏆 Wynik: <strong>${items[targetIdx]}</strong><br><a href="javascript:void(0);" onclick="alert('Kupon przypisany do przeglądarki!')">Odbierz bonus</a>`;
                    result.style.display = "block";
                } else {
                    // Dla koła centralnego podstawiamy pod licznik wygranego
                    const winnerField = document.querySelectorAll('#winnerName')[1] || document.getElementById('winnerName');
                    winnerField.innerHTML = `Wylosowano: <strong>${items[targetIdx]}</strong>!`;
                }
            }, 4500);
        }

        function spinPromoWheel() { executeSpin('promoWheel', 'btnPromo', 'promoResult', itemsPromo, 'promo'); }
        function spinTouristWheel() { executeSpin('touristWheel', 'btnTourist', 'touristResult', itemsTourist, 'tourist'); }

                    parts[3] = secs.toString().padStart(2, '0');
                    timer.innerText = parts.join(':');
                }
